baseURL: "https://eu-central-2.ch/"
# `locale` replaced `languageCode` in Hugo 0.158.
locale: "en-us"
title: "eu-central-2"
theme: "eu-central-2"

enableInlineShortcodes: true
enableRobotsTXT: true
enableEmoji: true
buildDrafts: false
buildFuture: false
buildExpired: false

# Hugo >= 0.128 key. On older Hugo this is `paginate: 10`.
pagination:
  pagerSize: 10

taxonomies:
  tag: tags

outputs:
  home:
    - HTML
    - RSS
    - JSON # search index (layouts/_default/index.json)

markup:
  goldmark:
    renderer:
      # Required by the rawhtml shortcode and inline HTML in existing posts.
      unsafe: true
  highlight:
    # noClasses: false makes Chroma emit classes instead of inline styles, so
    # assets/css/chroma.css controls the palette.
    noClasses: false
    codeFences: true
    guessSyntax: false
    lineNos: false
    tabWidth: 4
  tableOfContents:
    startLevel: 2
    endLevel: 4

params:
  description: "Notes on AWS, containers, Kubernetes and cloud engineering from Zürich."
  dateFormat: "2 January 2006"

  showReadingTime: true
  showBreadcrumbs: true
  showShareButtons: true
  showToc: false
  tocOpen: false

  homeTagLimit: 24

  author:
    name: "relivnd"

  # ---- Homepage hero -------------------------------------------------
  profile:
    title: "Welcome to eu-central-2"
    subtitle: "I'm Tobi. A Cloud Consultant from eu-central-2 (Zürich). This is the place where I write about AWS, Cloud Computing, DevOps and everything else. Currently I work @ copebit AG"
    buttons:
      - name: "Blog"
        url: "/posts/"
      - name: "About Me"
        url: "/aboutme/"
      - name: "Tools"
        url: "/tools/"
      - name: "Talks"
        url: "/talks/"
      - name: "copebit AG"
        url: "https://www.copebit.ch/en/home/"

  # Icon names must exist in layouts/partials/icon.html.
  socialIcons:
    - name: "linkedin"
      url: "https://www.linkedin.com/in/relivnd/"
    - name: "github"
      url: "https://github.com/relivnd"
    - name: "dev"
      url: "https://dev.to/relivnd"
    - name: "mastodon"
      url: "https://mastodon.social/@relivnd"
    - name: "email"
      url: "mailto:hej@relivnd.dev"

  # ---- Tools ---------------------------------------------------------
  # Editorial order for the grouped /tools page. Categories not listed are
  # appended in Hugo's default order.
  toolCategories:
    - "Coding"

  # ---- Search --------------------------------------------------------
  searchSections:
    - "posts"
    - "talks"
    - "tools"
  searchContentChars: 1200

  # ---- Newsletter (MailerLite) ---------------------------------------
  # accountId enables the universal snippet site-wide; formId places the
  # embedded form. Both come from MailerLite's embed code:
  #   ml('account', 'ACCOUNT_ID')  and  data-form="FORM_ID"
  # Left blank on purpose: with no accountId the theme ships zero
  # third-party JS, and the newsletter section renders a placeholder.
  mailerlite:
    accountId: ""
    formId: ""
    # Optional fallback while the embed is unconfigured: a hosted MailerLite
    # landing page URL for the button to link to.
    signupURL: ""

  # ---- Maps ----------------------------------------------------------
  # Used only when a talk has lat/lon. Overridden automatically if
  # themes/eu-central-2/assets/vendor/leaflet/leaflet.{css,js} exist, which is
  # the recommended setup — see the theme README.
  leaflet:
    cssURL: "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    jsURL: "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"

