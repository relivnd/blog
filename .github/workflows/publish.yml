name: Publish Blog
on:
  push:
    branches:
      - main
jobs:
  build:
    name: Build Hugo Site
    runs-on:
      - codebuild-relivnd_blog_pipeline-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"

      - name: Build
        run: hugo --minify

      - name: Check AWS CLI
        run: |
          which aws || echo "AWS CLI not found"
          aws --version || echo "AWS CLI version check failed"
          aws sts get-caller-identity || echo "AWS credentials not configured"

      - name: Deploy to S3
        run: |
          echo "Syncing to S3..."
          aws s3 sync public/ s3://blog.relivnd.dev --delete

      - name: Invalidate CloudFront
        run: |
          echo "Creating CloudFront invalidation..."
          aws cloudfront create-invalidation --distribution-id E2LOIVE2VIQGWU --paths "/*"
