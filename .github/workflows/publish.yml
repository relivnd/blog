name: Publish Blog
on:
  push:
    branches:
      - main
jobs:
  build:
    name: Build Hugo Site
    runs-on:
      - codebuild-relivnd_blog_pipeline-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'

      - name: Build
        run: hugo --minify

      - name: Deploy to S3
        run: aws s3 sync public/ s3://blog.relivnd.dev --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E2LOIVE2VIQGWU --paths "/*"
