<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "en" }}" dir="ltr">
<head>
  {{- partial "head.html" . }}
</head>
<body>
  <a class="skip-link" href="#main">{{ i18n "skip_to_content" }}</a>

  {{- partial "header.html" . }}

  <main id="main" class="main{{ if or .IsHome (eq .Section "tools") }} main--wide{{ end }}">
    {{- block "main" . }}{{ end }}
  </main>

  {{- partial "footer.html" . }}

  {{- partial "script.html" "js/app.js" }}
  {{- block "scripts" . }}{{ end }}
</body>
</html>
