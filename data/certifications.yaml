# Certifications shown in the homepage carousel.
#
# Fields:
#   title  (required) — caption under the badge
#   image  (required) — either a path under assets/ (processed to WebP at
#                       build time) or any URL/absolute path used verbatim
#   issuer (optional) — appended to the generated alt text
#   url    (optional) — credential verification link; makes the badge clickable
#   alt    (optional) — overrides the generated alt text entirely
#
# The image paths below point at the badges already published by the
# content/aboutme/ page bundle, so this works with no file moves. To get
# build-time WebP thumbnails instead, copy the PNGs into
# assets/certifications/ and change each `image` to
# "certifications/<file>.png" — the partial prefers assets/ when it finds a
# match. See the theme README.
#
# TODO(relivnd): add `url:` credential links. Verified badges are worth more
# than pictures of badges.

